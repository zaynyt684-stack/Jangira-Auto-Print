<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator · Jangira AutoPrint</title><link rel="stylesheet" href="./styles.css"><style>body{background:#f5f3ee}.operator{max-width:620px;margin:70px auto;padding:20px}.card{background:#fff;border:1px solid #ddd8ce;border-radius:24px;padding:32px;box-shadow:0 12px 40px #0000000d}.switch{display:flex;align-items:center;justify-content:space-between;padding:22px;border:1px solid #e2ded5;border-radius:18px;margin-top:24px}.status{font-weight:900}.status.on{color:#3d754b}.status.off{color:#9b4b40}.toggle{border:0;border-radius:14px;padding:14px 24px;font-weight:900;cursor:pointer}.toggle.on{background:#d9eadc;color:#285d35}.toggle.off{background:#f1d9d5;color:#7d382f}.note{color:#77736c;line-height:1.55}</style></head><body><main class="operator"><div class="card"><div class="mini-label">PRIVATE OPERATOR</div><h1>Jangira AutoPrint</h1><p class="note">Manually control whether the customer print portal is open or closed. This page does not read Windows software or printer status.</p><div class="switch"><div><div id="status" class="status off">Checking…</div><small id="updated">—</small></div><button id="toggle" class="toggle off" type="button" disabled>Loading…</button></div><p id="msg" class="note"></p></div></main><script src="./config.js"></script><script>const API=(window.JEM_CONFIG&&window.JEM_CONFIG.API_BASE_URL)||'';const statusEl=document.getElementById('status'),updated=document.getElementById('updated'),btn=document.getElementById('toggle'),msg=document.getElementById('msg');let state=false;async function load(){try{const r=await fetch(API+'/api/service-status?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();state=d.online===true||d.status==='online'||d.available===true;render();}catch(e){statusEl.textContent='Backend unavailable';statusEl.className='status off';btn.disabled=true;btn.textContent='Unavailable'}}function render(){statusEl.textContent=state?'PORTAL ONLINE':'PORTAL OFFLINE';statusEl.className='status '+(state?'on':'off');btn.textContent=state?'TURN OFF':'TURN ON';btn.className='toggle '+(state?'on':'off');btn.disabled=false;updated.textContent='Manual control'}async function toggle(){btn.disabled=true;msg.textContent='Updating…';try{const r=await fetch(API+'/api/service-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({online:!state})});if(!r.ok)throw Error(await r.text());const d=await r.json();state=d.online===true;render();msg.textContent=state?'Customer portal is now OPEN.':'Customer portal is now CLOSED.';}catch(e){msg.textContent='Could not change portal status. Backend endpoint is not configured yet.';btn.disabled=false}}btn.onclick=toggle;load();setInterval(load,3000);</script></body></html>
