<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operator · Jangira AutoPrint</title>
<link rel="stylesheet" href="./styles.css">
<style>
body{background:#f5f3ee}.operator{max-width:620px;margin:70px auto;padding:20px}.card{background:#fff;border:1px solid #ddd8ce;border-radius:24px;padding:32px;box-shadow:0 12px 40px #0000000d}.switch{display:flex;align-items:center;justify-content:space-between;padding:22px;border:1px solid #e2ded5;border-radius:18px;margin-top:24px}.status{font-weight:900}.status.on{color:#3d754b}.status.off{color:#9b4b40}.toggle{border:0;border-radius:14px;padding:14px 24px;font-weight:900;cursor:pointer}.toggle.on{background:#d9eadc;color:#285d35}.toggle.off{background:#f1d9d5;color:#7d382f}.note{color:#77736c;line-height:1.55}.token{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d8d3c9;border-radius:12px;margin-top:18px;font:inherit}.login{display:flex;gap:10px;margin-top:12px}.login button{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer;background:#151513;color:#fff}.login button:disabled{opacity:.5;cursor:not-allowed}.control[hidden]{display:none}.msg.ok{color:#3d754b}.msg.err{color:#9b4b40}.help{font-size:12px;margin-top:8px}
</style>
</head>
<body>
<main class="operator">
<div class="card">
<div class="mini-label">PRIVATE OPERATOR</div>
<h1>Jangira AutoPrint</h1>
<p class="note">Manually control whether the customer print portal is open or closed. This page does not read Windows software or printer status.</p>
<input id="token" class="token" type="password" placeholder="Enter AGENT_TOKEN" autocomplete="off">
<div class="login"><button id="login" type="button">LOGIN</button></div>
<p id="auth" class="note help">Enter the existing AGENT_TOKEN to unlock portal controls.</p>
<section id="control" class="control" hidden>
<div class="switch">
<div><div id="status" class="status off">Checking…</div><small id="updated">—</small></div>
<button id="toggle" class="toggle off" type="button">Loading…</button>
</div>
</section>
<p id="msg" class="note"></p>
</div>
</main>
<script src="./config.js"></script>
<script>
(() => {
  const API = (window.JEM_CONFIG && window.JEM_CONFIG.API_BASE_URL || '').replace(/\/$/, '');
  const statusEl = document.getElementById('status');
  const updatedEl = document.getElementById('updated');
  const btn = document.getElementById('toggle');
  const msg = document.getElementById('msg');
  const tokenEl = document.getElementById('token');
  const loginBtn = document.getElementById('login');
  const control = document.getElementById('control');
  const auth = document.getElementById('auth');

  let state = false;
  let token = '';
  let loggedIn = false;

  function setMsg(text, type) {
    msg.textContent = text || '';
    msg.className = 'note msg ' + (type || '');
  }

  function render() {
    statusEl.textContent = state ? 'PORTAL ONLINE' : 'PORTAL OFFLINE';
    statusEl.className = 'status ' + (state ? 'on' : 'off');
    btn.textContent = state ? 'TURN OFF' : 'TURN ON';
    btn.className = 'toggle ' + (state ? 'on' : 'off');
    btn.disabled = false;
    updatedEl.textContent = 'Manual control · live';
  }

  async function api(path, options = {}) {
    const response = await fetch(API + path, {
      cache: 'no-store',
      mode: 'cors',
      ...options,
      headers: {
        Accept: 'application/json',
        ...(options.headers || {})
      }
    });
    const text = await response.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch (_) {}
    if (!response.ok) {
      throw new Error(data.error || data.details || text || ('HTTP ' + response.status));
    }
    return data;
  }

  async function readStatus() {
    return api('/api/service-status?t=' + Date.now());
  }

  async function load() {
    if (!loggedIn) return;
    try {
      const data = await readStatus();
      state = data.online === true;
      render();
      setMsg('');
    } catch (error) {
      statusEl.textContent = 'BACKEND UNAVAILABLE';
      statusEl.className = 'status off';
      btn.disabled = true;
      btn.textContent = 'Unavailable';
      setMsg('Cannot read portal status: ' + (error.message || 'Request failed'), 'err');
    }
  }

  async function login() {
    const value = tokenEl.value.trim();
    if (!value) {
      setMsg('Enter AGENT_TOKEN first.', 'err');
      tokenEl.focus();
      return;
    }

    loginBtn.disabled = true;
    setMsg('Checking token…');

    try {
      const data = await readStatus();
      token = value;
      loggedIn = true;
      control.hidden = false;
      auth.textContent = 'Authenticated. Portal controls are unlocked.';
      state = data.online === true;
      render();
      setMsg('Token accepted.', 'ok');
    } catch (error) {
      loggedIn = false;
      control.hidden = true;
      setMsg('Backend unavailable: ' + (error.message || 'Request failed'), 'err');
    } finally {
      loginBtn.disabled = false;
    }
  }

  async function toggle() {
    if (!loggedIn || !token) return;

    const nextState = !state;
    btn.disabled = true;
    setMsg(nextState ? 'Opening customer portal…' : 'Closing customer portal…');

    try {
      const data = await api('/api/service-status', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Agent-Token': token
        },
        body: JSON.stringify({ online: nextState })
      });

      state = data.online === true;
      render();
      setMsg(state ? 'Customer portal is now OPEN.' : 'Customer portal is now CLOSED.', 'ok');
    } catch (error) {
      btn.disabled = false;
      setMsg('Could not change portal status: ' + (error.message || 'Request failed'), 'err');
    }
  }

  loginBtn.addEventListener('click', login);
  tokenEl.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      login();
    }
  });
  btn.addEventListener('click', toggle);

  setInterval(load, 3000);
})();
</script>
</body>
</html>
